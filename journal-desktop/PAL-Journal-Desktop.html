<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAL Trading Buddy Journal — V2.2 Fixed</title>
<style>
:root{
 --bg:#111214;--bg2:#17191c;--panel:#1d2024;--panel2:#23262b;--ink:#f4f5f6;--muted:#969ba3;
 --line:#30343a;--accent:#d13a43;--accent2:#ff626a;--accentSoft:rgba(209,58,67,.12);

}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:

 radial-gradient(700px 500px at -10% 70%,rgba(72,91,120,.10),transparent 60%),
 linear-gradient(180deg,var(--bg),#0d0e10 120%);
 font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}

.app{min-height:100vh;display:grid;grid-template-columns:252px 1fr}
.side{position:sticky;top:0;height:100vh;background:rgba(18,19,22,.92);backdrop-filter:blur(18px);border-right:1px solid #24272c;padding:22px 17px;display:flex;flex-direction:column;box-shadow:18px 0 50px rgba(0,0,0,.25);z-index:5}

.btn{border:1px solid #34383f;background:#1e2126;color:#e9ebee;border-radius:10px;padding:10px 13px;font-size:10px;font-weight:850;cursor:pointer;transition:.22s;box-shadow:0 6px 14px rgba(0,0,0,.15)}.btn:hover{transform:translateY(-2px);border-color:#474c55;box-shadow:0 12px 24px rgba(0,0,0,.22)}.btn.primary{border-color:var(--accent);background:linear-gradient(135deg,var(--accent),#a9272f);color:#fff;box-shadow:0 8px 20px rgba(209,58,67,.22)}.btn.primary:hover{box-shadow:0 12px 26px rgba(209,58,67,.32)}.btn.danger{color:#ff9ba0;background:rgba(255,95,104,.07);border-color:rgba(255,95,104,.20)}.btn.small{padding:7px 9px;font-size:9px}
.view{display:none}.view.on{display:block}.fade{animation:fade .34s ease both}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(180deg,rgba(32,34,38,.96),rgba(26,28,31,.96));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;transition:.24s}.card:hover{transform:translateY(-2px);border-color:#3a3f47;box-shadow:0 24px 60px rgba(0,0,0,.34)}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.hero h2{font-size:21px;letter-spacing:-.03em;margin:4px 0 7px}.hero p,.muted{color:var(--muted);font-size:11px;line-height:1.65}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:15px}.stat{background:linear-gradient(180deg,#22252a,#1b1d21);border:1px solid #30343a;border-radius:13px;padding:13px;box-shadow:var(--softShadow)}.stat small,.metric small,.review small{display:block;text-transform:uppercase;letter-spacing:.10em;font-size:7px;color:#777d85}.stat b{display:block;font-size:21px;margin-top:5px;letter-spacing:-.03em}.score{display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 42%,rgba(209,58,67,.13),transparent 52%),linear-gradient(180deg,#22252a,#1a1c1f)}
.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) 0 78%,#31353b 78%);box-shadow:0 0 35px rgba(209,58,67,.10),0 18px 44px rgba(0,0,0,.25);animation:float 5s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.ring:before{content:"";position:absolute;inset:11px;background:#1b1d20;border-radius:50%;border:1px solid #34383f}.ring div{position:relative}.ring b{display:block;font-size:29px;letter-spacing:-.05em}.ring span{font-size:8px;color:#7f858d;text-transform:uppercase;letter-spacing:.11em;font-weight:900}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.cardtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.cardtitle b{font-size:12px}.pill{font-size:8px;padding:5px 7px;border-radius:999px;background:#272a30;color:#8d939b;border:1px solid #34383e}.activity{display:grid;gap:8px}.row{display:grid;grid-template-columns:62px 1fr auto;gap:9px;align-items:center;padding:10px;border:1px solid #2d3137;background:linear-gradient(180deg,#202328,#1a1c20);border-radius:11px;transition:.2s}.row:hover{transform:translateY(-1px);border-color:#3b4048;box-shadow:0 10px 24px rgba(0,0,0,.18)}.row b{font-size:10px}.row small{font-size:8px;color:#777d85;display:block;margin-top:2px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}

.session-card{display:grid;gap:10px}.session-state{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border:1px solid #2e3238;border-radius:12px;background:linear-gradient(180deg,#22252a,#1b1d21)}.session-state strong{font-size:11px}.session-state span{font-size:8px;color:#7d838b}.session-open{border-left:3px solid var(--accent);box-shadow:inset 14px 0 24px rgba(209,58,67,.035)}.session-idle{border-left:3px solid #3b3f46}
.saved-trade{display:grid;grid-template-columns:74px 1fr auto;gap:11px;align-items:center;padding:12px 13px;background:linear-gradient(180deg,#21242a,#1b1d20);border:1px solid #30343a;border-radius:12px}.saved-trade .dir{font-size:9px;font-weight:950;letter-spacing:.08em}.saved-trade .pair{font-size:11px;font-weight:850}.saved-trade .meta{font-size:8px;color:#7d838b;margin-top:3px}.saved-trade .result{font-size:10px;font-weight:900}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,7,8,.74);backdrop-filter:blur(8px);z-index:50}.modal.on{display:flex}.modalbox{width:min(1180px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#17191d;border:1px solid #30343a;border-radius:18px;box-shadow:0 35px 100px rgba(0,0,0,.55);animation:modalIn .26s cubic-bezier(.2,.8,.2,1) both}@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}.mh{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px 9px;position:sticky;top:0;background:rgba(23,25,29,.96);backdrop-filter:blur(12px);z-index:2;border-bottom:1px solid #292d33}.mh h2{margin:2px 0;font-size:19px;letter-spacing:-.03em}.close{border:0;background:transparent;color:#858b93;font-size:25px;cursor:pointer}.tabs{display:flex;gap:6px;padding:10px 22px}.tab{border:1px solid #32363d;background:#1d2025;color:#8a9098;border-radius:999px;padding:8px 13px;font-size:9px;font-weight:900;cursor:pointer}.tab.on{background:#f1f2f3;color:#151619;border-color:#f1f2f3}.session{padding:0 22px 18px}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:8px 0 12px;gap:10px}.trade-list{display:grid;gap:12px}.trade{border:1px solid #30343a;border-radius:14px;background:linear-gradient(180deg,#1e2126,#1a1c20);padding:14px}.tradehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.tradehead b{font-size:12px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:#8f959d}.field input,.field select,.field textarea{width:100%;border:1px solid #30343a;background:#141619;color:#e8eaec;border-radius:9px;padding:8px;outline:none;font-size:10px}.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(209,58,67,.65);box-shadow:0 0 0 3px rgba(209,58,67,.10)}.field textarea{min-height:72px;resize:vertical}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.check{display:flex;gap:7px;align-items:center;padding:7px;border:1px solid #2e3238;background:#17191c;border-radius:9px;font-size:8px;color:#aeb3ba}.shots{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.shot{border:1px dashed #3c4149;border-radius:10px;padding:9px;background:#16181b}.shot b{font-size:8px;text-transform:uppercase;letter-spacing:.06em}.shot p{margin:4px 0;font-size:8px;color:#737983}.shot input{font-size:9px}.shot-preview{margin-top:7px;position:relative}.shot-preview img{width:100%;height:145px;object-fit:contain;border:1px solid #34383f;border-radius:8px;background:#111316;cursor:zoom-in}.shot-remove{position:absolute;right:5px;top:5px;border:0;background:#0f1012;color:#fff;border-radius:7px;font-size:8px;padding:5px 7px;cursor:pointer}.mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 22px;position:sticky;bottom:0;background:rgba(23,25,29,.97);border-top:1px solid #292d33}.empty{padding:20px;text-align:center;color:#6f757d;font-size:10px;border:1px dashed #30343a;border-radius:12px}
.fulltrade-overlay{position:fixed;inset:0;display:none;background:#101114;z-index:70;overflow:auto}.fulltrade-overlay.on{display:block;animation:pageIn .25s ease both}.fulltrade-head{position:sticky;top:0;background:rgba(16,17,20,.92);backdrop-filter:blur(14px);border-bottom:1px solid #292d33;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;z-index:2}.fulltrade-body{max-width:1200px;margin:0 auto;padding:24px}.fulltrade-title{font-size:24px;font-weight:900;letter-spacing:-.04em}.fulltrade-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.shot-large{background:#191b1f;border:1px solid #30343a;border-radius:14px;padding:12px}.shot-large img{width:100%;height:320px;object-fit:contain;background:#0e1012;border-radius:10px}.info-list{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.info{background:#191b1f;border:1px solid #30343a;border-radius:11px;padding:12px}.info small{display:block;font-size:7px;text-transform:uppercase;letter-spacing:.08em;color:#6f757d}.info b{display:block;margin-top:5px;font-size:12px}.full-note{white-space:pre-wrap;color:#aeb3ba;font-size:11px;line-height:1.75}
.import-note{margin-top:12px;padding:11px 12px;border-radius:11px;border:1px solid rgba(109,169,255,.20);background:rgba(109,169,255,.06);color:#8aa8d2;font-size:8px;line-height:1.6}
.saved-trade{position:relative;overflow:hidden}.saved-trade:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.025) 45%,transparent 62%);transform:translateX(-120%);animation:sheen 7s ease-in-out infinite}@keyframes sheen{0%,78%,100%{transform:translateX(-120%)}88%{transform:translateX(120%)}}.session-state,.heat-card,.stat,.review .item{position:relative;overflow:hidden}.session-state:before,.stat:before,.review .item:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}.btn.primary:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent,rgba(255,255,255,.12),transparent);transform:translateX(-140%);animation:buttonSheen 5s ease-in-out infinite}@keyframes buttonSheen{0%,76%,100%{transform:translateX(-140%)}86%{transform:translateX(140%)}}.ring{filter:drop-shadow(0 0 10px rgba(209,58,67,.08))}.cardtitle b,.hero h2{letter-spacing:-.025em}
.viewer-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,7,.96);backdrop-filter:blur(10px);z-index:100;padding:70px 28px 30px;overflow:hidden;touch-action:none}.viewer-image{max-width:92vw;max-height:calc(100vh - 110px);width:auto;height:auto;object-fit:contain;transform-origin:center;transition:transform .12s ease;box-shadow:0 30px 100px rgba(0,0,0,.48);border-radius:10px;cursor:zoom-in;user-select:none;-webkit-user-drag:none;touch-action:none}.viewer-image.zoomed{cursor:grab}.viewer-image.dragging{cursor:grabbing;transition:none}.viewer-controls{position:fixed;top:18px;right:22px;display:flex;gap:7px;z-index:101}.viewer-controls .btn{min-width:34px;padding:8px 10px}.viewer-hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:8px;color:#7d838b;z-index:101}
@media(max-width:1200px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:1050px){.hero,.grid2{grid-template-columns:1fr}.form{grid-template-columns:repeat(2,1fr)}.fulltrade-grid{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{grid-template-columns:repeat(4,1fr)}.sidefoot{display:none}.main{padding:15px}.form,.checks,.shots,.info-list{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(4,1fr)}.fulltrade-body{padding:14px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><div class="logo">TD</div><div><b>Trading Discipline</b><small>V2.2 • FIXED</small></div></div>
<div class="nav"><button class="active" data-view="dash">Dashboard</button><button data-view="month">Calendar</button><button data-view="review">Review</button><button data-view="settings">Settings</button></div>
<div class="sidefoot">Local-first journal • JSON portable • no cloud dependency in preview</div>
</aside>

<main class="main">
<div class="head"><div><div class="eyebrow">TRADING DISCIPLINE TRACKER</div><h1 id="title">Dashboard</h1></div>
<div class="actions"><button class="btn" id="backupBtn">Backup</button><button class="btn" id="importBtn">Import JSON</button><button class="btn primary" id="newBtn">+ New Journal Day</button><input id="importInput" type="file" accept=".json,application/json" hidden></div></div>

<section id="dash" class="view on"></section>
<section id="month" class="view"></section>
<section id="review" class="view"></section>
<section id="settings" class="view"></section>
</main>
</div>

<div class="modal" id="modal">
<div class="modalbox">
<div class="mh"><div><div class="eyebrow" id="modalMode">NEW JOURNAL DAY</div><h2 id="modalTitle"></h2></div><button class="close" id="close">×</button></div>
<div style="padding:10px 22px 4px;display:grid;grid-template-columns:1fr 1fr;gap:9px">
<div class="field"><label>Day Status</label><select id="dayStatus"><option>Auto</option><option>Logged</option><option>Rest</option><option>No Trade</option></select></div>
<div class="field"><label>Overall Emotion</label><input id="dayEmotion" placeholder="Calm, focused, impatient..."></div>
<div class="field" style="grid-column:1/-1"><label>Daily Note</label><textarea id="dayNote" placeholder="One useful observation from today" style="min-height:54px"></textarea></div>
</div>
<div class="tabs"><button class="tab on" data-s="london">London</button><button class="tab" data-s="newyork">New York</button></div>
<div class="session">
<div class="toolbar"><div class="muted">One trade per session • up to 4 screenshots per trade</div><button class="btn small" id="addTrade">+ Add Trade</button></div>
<div id="trades" class="trade-list"></div>
</div>
<div class="mfoot"><button class="btn danger" id="deleteDay">Delete Day</button><div><button class="btn" id="cancel">Cancel</button><button class="btn" id="editDay" style="display:none">Edit Day</button><button class="btn primary" id="save">Create Journal Day</button></div></div>
</div></div>

<div class="viewer-wrap" id="viewer" style="display:none"><div class="viewer-controls"><button class="btn" id="zoomOut">−</button><button class="btn" id="zoomReset">100%</button><button class="btn" id="zoomIn">+</button><button class="btn" id="viewerClose">Close</button></div><img class="viewer-image" id="viewerImg" alt="Screenshot"><div class="viewer-hint">Mouse wheel to zoom · double-click to reset</div></div>
<div class="fulltrade-overlay" id="fullTrade"><div class="fulltrade-head"><div><div class="eyebrow">TRADE DETAIL</div><div class="fulltrade-title" id="fullTitle"></div></div><button class="btn" id="fullClose">Back to Journal</button></div><div class="fulltrade-body" id="fullBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const DBKEY='PAL_TDT_V21_PREVIEW_JSON_FINAL';const MAX_SIZE=6*1024*1024;const state={version:2,days:{}};let currentDate=null,currentSession='london',editing=false,dayExists=false,daySnapshot=null,toastTimer=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const todayKey=()=>dateKey(new Date());
const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function blankTrade(){return{direction:'',setup:'',result:'',emotion:'',r:'',pnl:'',entry:'',sl:'',tp:'',note:'',checks:[],screenshots:[]}}
function blankDay(d){return{date:d,status:'Planned',emotion:'',note:'',sessions:{london:{trades:[]},newyork:{trades:[]}}}}
function saveState(){localStorage.setItem(DBKEY,JSON.stringify(state))}
function normalizeState(){state.days=state.days&&typeof state.days==='object'?state.days:{};for(const d of Object.keys(state.days)){const day=state.days[d];day.date??=d;day.emotion??='';day.note??='';day.status??='Planned';day.sessions??={};for(const session of ['london','newyork']){day.sessions[session]??={trades:[]};day.sessions[session].trades??=[];day.sessions[session].trades.forEach(t=>{t.checks??=[];t.screenshots??=[]})}}}
function loadState(){try{const raw=localStorage.getItem(DBKEY);if(raw){const x=JSON.parse(raw);if(x&&typeof x==='object')Object.assign(state,x)}}catch(_){ }normalizeState()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),1700)}
function allTrades(){return Object.values(state.days).flatMap(d=>['london','newyork'].flatMap(session=>(d.sessions?.[session]?.trades||[]).map((t,index)=>({...t,date:d.date,session,index}))));}
