name: Build PAL Trading Buddy Android App

on:
  push:
    branches: [online-market-data]
    paths:
      - "phone-app/**"
      - ".github/workflows/build-android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        run: gradle -p phone-app --no-daemon assembleDebug

      - name: Verify APK and print checksum
        run: |
          test -f phone-app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum phone-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh phone-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable Android app
        uses: actions/upload-artifact@v4
        with:
          name: PAL-Trading-Buddy-Android-App
          path: phone-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
