name: Build PAL Trading Buddy Desktop

on:
  push:
    branches: [online-market-data]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build backend executable
        run: python -m PyInstaller --noconfirm --clean --distpath desktop/backend desktop/packaging/backend.spec

      - name: Verify backend executable
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/backend/PALBackend.exe")) {
            Write-Error "PALBackend.exe was not created."
            exit 1
          }

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "desktop/dist/PAL-Trading-Buddy-Setup-*.exe" -ErrorAction SilentlyContinue
          if (!$installer) {
            Write-Error "PAL Trading Buddy installer was not created."
            exit 1
          }
          Write-Host "Created installer: $($installer.FullName)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PAL-Trading-Buddy-Windows
          path: desktop/dist/PAL-Trading-Buddy-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
