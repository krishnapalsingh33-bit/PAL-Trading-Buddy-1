name: Validate PAL Trading Buddy

on:
  pull_request:
    branches: [main]
  push:
    branches: [online-market-data]

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    needs: [market-api]
    steps:
      - name: Wait until the latest dashboard and mobile download are deployed
        env:
          PAL_BASE_URL: https://pal-market-data-api.onrender.com
        run: |
          for attempt in {1..24}; do
            page=$(curl -fsS --max-time 15 "$PAL_BASE_URL/dashboard" || true)
            download_status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$PAL_BASE_URL/download/mobile" || true)
            if [[ "$page" == *"right-now-cards"* && "$page" == *'key:"XAUUSD"'* && "$download_status" == "200" ]]; then
              echo "Latest four-asset dashboard and portable download are live."
              exit 0
            fi
            echo "Waiting for Render deploy ($attempt/24); download HTTP=$download_status"
            sleep 10
          done
          echo "Latest dashboard/download did not become available within four minutes."
          exit 1
      - name: Smoke test live API, provider schema and Right Now Bias
        env:
          PAL_BASE_URL: https://pal-market-data-api.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = os.environ["PAL_BASE_URL"].rstrip("/")
          def get(path, timeout=30):
              req = urllib.request.Request(base + path, headers={"Accept": "application/json", "Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.status, response.headers, response.read()
          status, _, raw = get("/health", 15)
          health = json.loads(raw)
          assert status == 200 and health.get("status") == "healthy", health
          status, _, raw = get("/pal/markets", 40)
          quotes = json.loads(raw)
          expected = {"DXY", "XAUUSD", "BTCUSD", "GBPUSD"}
          assert status == 200 and expected.issubset(set(quotes.get("markets", {}))), quotes
          provider = quotes.get("provider", {})
          print(f"Market API: {quotes.get('status')} · usable {provider.get('usable_quotes')}/4 · fresh {provider.get('fresh_quotes')}/4")
          status, _, raw = get("/pal/analysis-status", 25)
          diag = json.loads(raw)
          assert status == 200 and diag.get("reachable") and (diag.get("provider_status") or {}).get("success"), diag
          status, _, raw = get("/pal/analysis/GBPUSD", 90)
          analysis = json.loads(raw)
          assert status == 200 and analysis.get("success"), analysis
          news = ((analysis.get("report") or {}).get("news") or {})
          today = (news.get("today_bias") or {}).get("today") or {}
          now = today.get("right_now") or {}
          keys = {"dxy", "gbpusd", "xauusd", "btcusd"}
          assert keys.issubset(set(now)), {"right_now_keys": sorted(now)}
          print("PAL analysis: connected · Right Now Bias includes DXY, GBP/USD, Gold and Bitcoin")
          PY

  market-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install market API dependencies
        working-directory: market-api
        run: pip install -r requirements.txt
      - name: Compile market API and Vercel entrypoint
        working-directory: market-api
        run: python -m py_compile main.py index.py
      - name: Run market API regression tests
        working-directory: market-api
        run: python -m unittest discover -s . -p "test_*.py" -v
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile PAL backend modules
        working-directory: backend
        run: >-
          python -m py_compile
          main.py
          analysis/news_engine.py
          analysis/macro_bias_engine.py
          analysis/report_engine.py
          analysis/today_only_bias_engine.py
          analysis/cross_asset_bias_engine.py
          analysis/evidence_bias_engine.py
          providers/*.py
          services/*.py
          models/*.py
      - name: Run online market-data tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --no-package-lock --force
      - name: Install frontend build tools explicitly
        working-directory: frontend
        run: npm install --no-save --include=dev --no-package-lock typescript@6.0.3 vite@8.2.0 @vitejs/plugin-react@6.0.5
      - name: TypeScript check
        working-directory: frontend
        run: ./node_modules/.bin/tsc -b
      - name: Production build
        working-directory: frontend
        run: ./node_modules/.bin/vite build
