name: Validate PAL Trading Buddy

on:
  pull_request:
    branches: [main]
  push:
    branches: [online-market-data]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile PAL backend modules
        working-directory: backend
        run: >-
          python -m py_compile
          main.py
          analysis/news_engine.py
          analysis/macro_bias_engine.py
          analysis/report_engine.py
          providers/*.py
          services/*.py
          models/*.py
      - name: Run online market-data tests
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_online_market_data_provider.py' -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc -b
