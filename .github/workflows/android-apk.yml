name: Build PAL Trading Buddy Android APK

on:
  workflow_dispatch:
  push:
    branches: [mobile-app]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --no-audit --no-fund

      - name: Set mobile backend URL
        run: |
          cat > frontend/.env.production <<'EOF'
          VITE_PAL_API_URL=https://pal-trading-buddy-1.onrender.com
          EOF

      - name: Build frontend
        working-directory: frontend
        run: |
          node ./node_modules/typescript/bin/tsc -b
          node ./node_modules/vite/bin/vite.js build

      - name: Verify mobile build configuration
        run: |
          test -f frontend/dist/index.html
          grep -R "pal-trading-buddy-1.onrender.com" frontend/dist >/dev/null
          ! grep -R "127.0.0.1:8000" frontend/dist >/dev/null
          echo "Mobile build points to deployed Render backend."

      - name: Smoke test deployed mobile API
        run: |
          python - <<'PY'
          import json, sys, urllib.request
          base = "https://pal-trading-buddy-1.onrender.com"
          for path in ("/mobile/health", "/health"):
              with urllib.request.urlopen(base + path, timeout=30) as r:
                  body = json.loads(r.read().decode())
                  if r.status != 200:
                      raise SystemExit(f"{path}: HTTP {r.status}")
                  print(path, body)
          with urllib.request.urlopen(base + "/mobile/analyze/GBPUSD", timeout=120) as r:
              body = json.loads(r.read().decode())
              print("/mobile/analyze/GBPUSD", r.status, list(body.keys()))
              if r.status != 200 or not isinstance(body, dict) or not body.get("success"):
                  raise SystemExit("Mobile analysis endpoint did not return success=true")
          PY

      - name: Prepare Capacitor toolchain
        run: |
          npm init -y
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest typescript@latest --no-audit --no-fund
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.paltradingbuddy.app",
            "appName": "PAL Trading Buddy",
            "webDir": "frontend/dist"
          }
          EOF

      - name: Add Android platform
        run: node ./node_modules/@capacitor/cli/bin/capacitor add android

      - name: Sync Android
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PAL-Trading-Buddy-Android-FINAL
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
