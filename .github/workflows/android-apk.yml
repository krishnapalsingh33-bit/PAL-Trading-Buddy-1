name: Build PAL Trading Buddy Android APK

on:
  workflow_dispatch:
  push:
    branches: [mobile-app]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --no-audit --no-fund

      - name: Verify frontend toolchain
        working-directory: frontend
        run: |
          node --version
          npm --version
          node -e "console.log('vite package:', require('./node_modules/vite/package.json').version)"
          node -e "console.log('typescript package:', require('./node_modules/typescript/package.json').version)"
          test -x ./node_modules/.bin/vite
          test -x ./node_modules/.bin/tsc

      - name: Build frontend
        working-directory: frontend
        run: ./node_modules/.bin/tsc -b && ./node_modules/.bin/vite build

      - name: Install Capacitor
        run: npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android --no-audit --no-fund

      - name: Init Capacitor
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "PAL Trading Buddy" "com.paltradingbuddy.app" --web-dir=frontend/dist --npm-client=npm
          fi

      - name: Add Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PAL-Trading-Buddy-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error