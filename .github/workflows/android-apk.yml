name: Build PAL Trading Buddy Android APK

on:
  workflow_dispatch:
  push:
    branches: [mobile-app]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: |
          node ./node_modules/typescript/bin/tsc -b
          node ./node_modules/vite/bin/vite.js build

      - name: Prepare Capacitor toolchain
        run: |
          npm init -y
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest typescript@latest --no-audit --no-fund
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.paltradingbuddy.app",
            "appName": "PAL Trading Buddy",
            "webDir": "frontend/dist"
          }
          EOF
          node -e "console.log('capacitor cli:', require('./node_modules/@capacitor/cli/package.json').version)"
          test -f ./node_modules/@capacitor/cli/bin/capacitor

      - name: Add Android platform
        run: node ./node_modules/@capacitor/cli/bin/capacitor add android

      - name: Sync Android
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PAL-Trading-Buddy-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
