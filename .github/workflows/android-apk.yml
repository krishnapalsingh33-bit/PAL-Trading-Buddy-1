name: Build PAL Trading Buddy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Capacitor dependencies
        run: npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize Capacitor when needed
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "PAL Trading Buddy" "com.paltradingbuddy.app" --web-dir=frontend/dist --npm-client=npm
          fi

      - name: Add Android platform when needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PAL-Trading-Buddy-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
