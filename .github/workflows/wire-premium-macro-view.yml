name: Wire premium macro view

on:
  push:
    branches: [online-market-data]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: wire premium macro view') && !startsWith(github.event.head_commit.message, 'chore: apply premium macro view wiring') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: online-market-data
          fetch-depth: 2
      - name: Switch Macro View to premium design
        shell: python
        run: |
          from pathlib import Path
          path = Path('frontend/src/App.tsx')
          text = path.read_text(encoding='utf-8')
          import_line = 'import MacroViewPremium from "./pages/MacroViewPremium";\n'
          if import_line not in text:
              text = text.replace('import MacroView from "./pages/MacroView";\n', 'import MacroView from "./pages/MacroView";\n' + import_line, 1)
          text = text.replace('if (page === "macro-view") return <MacroView onPageChange={navigate} />;', 'if (page === "macro-view") return <MacroViewPremium onPageChange={navigate} />;')
          path.write_text(text, encoding='utf-8')
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: apply premium macro view wiring"
          git push origin online-market-data
