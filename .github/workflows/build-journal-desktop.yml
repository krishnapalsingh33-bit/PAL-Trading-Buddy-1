name: Build PAL Journal Windows Desktop

on:
  push:
    branches:
      - journal-desktop-v23
    paths:
      - "journal-desktop/**"
      - ".github/workflows/build-journal-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Windows desktop launcher
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PAL-Journal-Desktop-V2.3
          --add-data "journal-desktop/PAL-Journal-Desktop.html;."
          journal-desktop/launch_journal.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PAL-Journal-Desktop-V2.3.exe")) {
            Write-Error "PAL-Journal-Desktop-V2.3.exe was not created."
            exit 1
          }

      - name: Upload Windows desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: PAL-Journal-Desktop-V2.3-Windows
          path: dist/PAL-Journal-Desktop-V2.3.exe
          if-no-files-found: error
          retention-days: 30
