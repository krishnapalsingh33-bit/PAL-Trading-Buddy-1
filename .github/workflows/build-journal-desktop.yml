name: Build PAL Journal Windows Desktop

on:
  push:
    branches: [journal-desktop-v23]
    paths:
      - "journal-desktop/**"
      - ".github/workflows/build-journal-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: journal-desktop/package.json
      - name: Install dependencies
        working-directory: journal-desktop
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        working-directory: journal-desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
      - name: Build Windows installer
        working-directory: journal-desktop
        run: npm run dist
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "journal-desktop/dist/PAL-Trading-Journal-Setup-*.exe" -ErrorAction SilentlyContinue
          if (!$installer) { Write-Error "Windows installer was not created."; exit 1 }
          Write-Host "Created: $($installer.FullName)"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PAL-Trading-Journal-V2.4-Windows
          path: journal-desktop/dist/PAL-Trading-Journal-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
